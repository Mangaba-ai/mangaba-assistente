<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes principais -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#FF8E53;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFD23F;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#FFA726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF7043;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#FFE082;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FF8C42;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:0.1" />
    </radialGradient>
    
    <linearGradient id="mangoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE082;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFD54F;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FFC107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8F00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#81C784;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E88E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtros e efeitos -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="4" result="offset"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fundo com glow -->
  <circle cx="60" cy="60" r="55" fill="url(#glowGradient)" opacity="0.6"/>
  
  <!-- Círculo principal com gradiente -->
  <circle cx="60" cy="60" r="45" fill="url(#primaryGradient)" filter="url(#dropShadow)"/>
  
  <!-- Reflexo superior -->
  <ellipse cx="60" cy="35" rx="35" ry="15" fill="url(#glowGradient)" opacity="0.4"/>
  
  <!-- Forma da manga principal -->
  <path d="M35 55 C35 40, 45 30, 60 35 C75 30, 85 40, 85 55 C85 70, 80 85, 60 85 C40 85, 35 70, 35 55 Z" 
        fill="url(#mangoGradient)" filter="url(#dropShadow)"/>
  
  <!-- Detalhes internos da manga -->
  <ellipse cx="60" cy="58" rx="18" ry="22" fill="#FFE082" opacity="0.8"/>
  <ellipse cx="60" cy="58" rx="12" ry="16" fill="#FFD54F" opacity="0.9"/>
  <ellipse cx="60" cy="58" rx="8" ry="12" fill="#FFC107" opacity="0.7"/>
  
  <!-- Folha da manga -->
  <path d="M60 35 C65 28, 72 30, 70 38 C68 42, 62 40, 60 35 Z" 
        fill="url(#leafGradient)" filter="url(#dropShadow)"/>
  
  <!-- Detalhes da folha -->
  <path d="M62 35 L68 32 M64 37 L69 35" stroke="#4CAF50" stroke-width="1" opacity="0.6"/>
  
  <!-- Highlight principal -->
  <ellipse cx="50" cy="45" rx="6" ry="8" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="52" cy="47" rx="3" ry="4" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Elementos de IA - Circuitos neurais -->
  <g stroke="url(#aiGradient)" stroke-width="2" fill="none" opacity="0.7" filter="url(#glow)">
    <!-- Nós neurais -->
    <circle cx="25" cy="25" r="3" fill="url(#aiGradient)"/>
    <circle cx="95" cy="25" r="3" fill="url(#aiGradient)"/>
    <circle cx="25" cy="95" r="3" fill="url(#aiGradient)"/>
    <circle cx="95" cy="95" r="3" fill="url(#aiGradient)"/>
    
    <!-- Conexões neurais -->
    <path d="M25 25 Q40 35 50 45" stroke-dasharray="2,2"/>
    <path d="M95 25 Q80 35 70 45" stroke-dasharray="2,2"/>
    <path d="M25 95 Q40 85 50 75" stroke-dasharray="2,2"/>
    <path d="M95 95 Q80 85 70 75" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Padrão de dados binários -->
  <g fill="#FFFFFF" opacity="0.2" font-family="monospace" font-size="8">
    <text x="15" y="15">01</text>
    <text x="100" y="15">10</text>
    <text x="15" y="110">11</text>
    <text x="100" y="110">01</text>
  </g>
  
  <!-- Anel externo decorativo -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#primaryGradient)" stroke-width="1" opacity="0.3" stroke-dasharray="5,5">
    <animateTransform attributeName="transform" type="rotate" values="0 60 60;360 60 60" dur="20s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Partículas flutuantes -->
  <g fill="#FFE082" opacity="0.6">
    <circle cx="20" cy="40" r="1">
      <animate attributeName="cy" values="40;35;40" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="80" r="1">
      <animate attributeName="cy" values="80;75;80" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="85" r="1">
      <animate attributeName="cy" values="85;80;85" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>